<!DOCTYPE html>
<html>
<head>
    <title>Insurance Cost Predictor</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            padding: 30px;
        }
        form {
            background: white;
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input, select {
            margin: 8px;
            padding: 8px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Insurance Cost Prediction</h2>

<form action="/predict" method="post">

    <input type="number" name="Age" placeholder="Age" required><br>

    <input type="number" step="0.1" name="BMI" placeholder="BMI" required><br>

    <label>Diabetes:</label>
    <select name="Diabetes">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Blood Pressure Problems:</label>
    <select name="BloodPressureProblems">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Any Transplants:</label>
    <select name="AnyTransplants">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Any Chronic Diseases:</label>
    <select name="AnyChronicDiseases">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Known Allergies:</label>
    <select name="KnownAllergies">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>History of Cancer in Family:</label>
    <select name="HistoryOfCancerInFamily">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select><br>

    <label>Number of Major Surgeries:</label>
    <select name="NumberOfMajorSurgeries">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
    </select><br><br>

    <button type="submit">Predict</button>
</form>

<h3>{{ prediction_text }}</h3>
</body>
</html>
